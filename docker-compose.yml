services:
  bowlyzer:
    build: .
    ports:
      - "${BOWLYZER_HOST_PORT:-8080}:8000"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-change-me-in-production}
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
      LOG_LEVEL: info
    volumes:
      # Refresh CSV data without rebuilding the image
      - ./database:/app/database:ro
    restart: unless-stopped
    mem_limit: 900m
    cpus: 1.0
