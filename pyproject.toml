[project]
name = "bowlyzer-legacy"
version = "0.1.0"
description = "Bowlyzer legacy Flask app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "tqdm>=4.66",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
