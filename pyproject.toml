[project]
name = "bowlyzer-legacy"
version = "0.1.0"
description = "Bowlyzer legacy Flask app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.0",
    "gunicorn>=23.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--ignore=tests/domain",
    "--ignore=tests/application",
    "--ignore=tests/infrastructure",
    "--ignore=tests/integration",
]
